name: Java CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'README.md'
      - 'renovate.json'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Compila e testa il progetto su tutte le piattaforme supportate
  # (JavaFX include i nativi per linux, mac e win)
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build and test with Gradle
        run: .\gradlew.bat build --no-daemon

  validate-wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

  # Crea il fat jar (shadowJar) e lo pubblica come artifact solo
  # quando viene pushato un tag di release (es. v1.0.0).
  create-release:
    needs: [build-and-test, validate-wrapper]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build fat jar
        run: .\gradlew.bat shadowJar --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unibo-tutoring-jar
          path: build/libs/*-all.jar